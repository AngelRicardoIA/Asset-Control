<!DOCTYPE html>
<html lang="es" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/document-head :: head('Nueva persona')}"></head>
<body>
<header th:replace="~{fragments/app-header :: header}"></header>

<main class="page-content narrow-content">
    <section class="page-heading">
        <div>
            <p class="eyebrow">Personas</p>
            <h1>Nueva persona</h1>
            <p>Registra sus datos principales para futuras asignaciones.</p>
        </div>
    </section>

    <form class="form-panel" th:action="@{/people}" method="post">
        <div th:replace="~{people/form-fields :: fields(${form})}"></div>

        <div class="form-actions">
            <a class="secondary-button" th:href="@{/people}">Cancelar</a>
            <button class="primary-button" type="submit">Guardar persona</button>
        </div>
    </form>
</main>
</body>
</html>
