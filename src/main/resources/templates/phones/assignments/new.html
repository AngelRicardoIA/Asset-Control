<!DOCTYPE html>
<html lang="es" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/document-head :: head('Asignar teléfono')}"></head>
<body>
<header th:replace="~{fragments/app-header :: header}"></header>

<main class="page-content narrow-content">
    <section class="page-heading">
        <div>
            <p class="eyebrow">Movimiento de teléfono</p>
            <h1 th:text="${phone.phoneLine != null ? phone.phoneLine.number : phone.imei}">Teléfono</h1>
            <p th:text="${phone.brand + ' ' + phone.model}">Marca Modelo</p>
        </div>
    </section>

    <form
            class="form-panel"
            data-assignment-form
            th:action="@{/phones/{phoneId}/assignments(phoneId=${phoneId})}"
            th:object="${form}"
            method="post"
    >
        <p class="form-error" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></p>

        <div class="form-field">
            <label for="personId">Persona</label>
            <select id="personId" th:field="*{personId}">
                <option value="">Selecciona una persona</option>
                <option
                        th:each="person : ${people}"
                        th:value="${person.id}"
                        th:text="${person.username + ' · ' + person.fullName}"
                ></option>
            </select>
            <small class="form-error" th:errors="*{personId}"></small>
        </div>

        <details class="inline-site-creation" th:open="${#lists.isEmpty(people)}">
            <summary>Registrar una persona nueva</summary>

            <div class="field-grid">
                <div class="form-field">
                    <label for="newPersonExternalId">ID</label>
                    <input id="newPersonExternalId" type="text" th:field="*{newPersonExternalId}" maxlength="100">
                    <small class="form-error" th:errors="*{newPersonExternalId}"></small>
                </div>

                <div class="form-field">
                    <label for="newPersonUsername">Nombre de usuario</label>
                    <input id="newPersonUsername" type="text" th:field="*{newPersonUsername}" maxlength="100">
                    <small class="form-error" th:errors="*{newPersonUsername}"></small>
                </div>

                <div class="form-field">
                    <label for="newPersonFullName">Nombre completo</label>
                    <input id="newPersonFullName" type="text" th:field="*{newPersonFullName}" maxlength="150">
                    <small class="form-error" th:errors="*{newPersonFullName}"></small>
                </div>

                <div class="form-field">
                    <label for="newPersonEmail">Correo</label>
                    <input id="newPersonEmail" type="email" th:field="*{newPersonEmail}" maxlength="254">
                    <small class="form-error" th:errors="*{newPersonEmail}"></small>
                </div>
            </div>
        </details>

        <div class="field-grid assignment-fields">
            <div class="form-field">
                <label for="type">Tipo de movimiento</label>
                <select id="type" th:field="*{type}" data-assignment-type>
                    <option
                            th:each="assignmentType : ${assignmentTypes}"
                            th:value="${assignmentType}"
                            th:text="${assignmentType.label}"
                    ></option>
                </select>
                <small class="form-error" th:errors="*{type}"></small>
            </div>

            <div class="form-field">
                <label for="assignedAt">Fecha de asignación</label>
                <input id="assignedAt" type="date" th:field="*{assignedAt}" required>
                <small class="form-error" th:errors="*{assignedAt}"></small>
            </div>

            <div class="form-field full-width is-hidden" data-due-date-field>
                <label for="dueAt">Vencimiento del préstamo</label>
                <input id="dueAt" type="date" th:field="*{dueAt}" data-due-date>
                <small class="form-error" th:errors="*{dueAt}"></small>
            </div>

            <div class="form-field full-width">
                <label for="observations">Observaciones</label>
                <textarea id="observations" th:field="*{observations}" maxlength="2000"></textarea>
                <small class="form-error" th:errors="*{observations}"></small>
            </div>
        </div>

        <div class="form-actions">
            <a class="secondary-button" th:href="@{/phones/{phoneId}(phoneId=${phoneId})}">Cancelar</a>
            <button class="primary-button" type="submit">Guardar movimiento</button>
        </div>
    </form>
</main>

<script th:src="@{/js/assignment-form.js}" defer></script>
</body>
</html>
