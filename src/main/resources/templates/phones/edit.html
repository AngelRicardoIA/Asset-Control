<!DOCTYPE html>
<html lang="es" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/document-head :: head('Editar teléfono')}"></head>
<body>
<header th:replace="~{fragments/app-header :: header}"></header>

<main class="page-content">
    <section class="page-heading">
        <div>
            <p class="eyebrow">Teléfonos</p>
            <h1>Editar teléfono</h1>
            <p>Puedes liberar una línea, elegir otra disponible o registrar una nueva.</p>
        </div>
    </section>

    <form class="form-panel"
          th:action="@{/phones/{phoneId}(phoneId=${phoneId})}"
          th:object="${form}"
          method="post">

        <p class="form-error" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></p>

        <div class="field-grid">
            <div class="form-field">
                <label for="imei">IMEI</label>
                <input id="imei" th:field="*{imei}" maxlength="32" required>
                <small class="form-error" th:errors="*{imei}"></small>
            </div>

            <div class="form-field">
                <label for="brand">Marca</label>
                <input id="brand" th:field="*{brand}" maxlength="100" required>
                <small class="form-error" th:errors="*{brand}"></small>
            </div>

            <div class="form-field">
                <label for="model">Modelo</label>
                <input id="model" th:field="*{model}" maxlength="100" required>
                <small class="form-error" th:errors="*{model}"></small>
            </div>

            <div class="form-field">
                <label for="status">Estado</label>
                <select id="status" th:field="*{status}">
                    <option th:each="phoneStatus : ${phoneStatuses}"
                            th:value="${phoneStatus}"
                            th:text="${phoneStatus.label}">
                    </option>
                </select>
                <small class="form-error" th:errors="*{status}"></small>
            </div>

            <div class="form-field">
                <label for="siteId">Ubicación</label>
                <select id="siteId" th:field="*{siteId}">
                    <option value="">Selecciona una ubicación</option>
                    <option th:each="site : ${sites}"
                            th:value="${site.id}"
                            th:text="${site.name}">
                    </option>
                </select>
                <small class="form-error" th:errors="*{siteId}"></small>
            </div>

            <div class="form-field full-width">
                <details class="inline-site-creation">
                    <summary>Agregar una ubicación nueva</summary>
                    <div class="form-field">
                        <label for="newSiteName">Nombre de la ubicación</label>
                        <input id="newSiteName" th:field="*{newSiteName}" maxlength="100">
                        <small class="form-error" th:errors="*{newSiteName}"></small>
                    </div>
                </details>
            </div>

            <div class="form-field">
                <label for="phoneLineId">Línea actual o disponible</label>
                <select id="phoneLineId" th:field="*{phoneLineId}">
                    <option value="">Sin línea</option>
                    <option th:each="phoneLine : ${phoneLines}"
                            th:value="${phoneLine.id}"
                            th:text="${phoneLine.number + (phoneLine.carrier != null ? ' · ' + phoneLine.carrier : '')}">
                    </option>
                </select>
                <small class="form-error" th:errors="*{phoneLineId}"></small>
            </div>

            <div class="form-field full-width">
                <details class="inline-site-creation">
                    <summary>O registra una línea nueva</summary>
                    <div class="field-grid">
                        <div class="form-field">
                            <label for="newLineNumber">Número de línea</label>
                            <input id="newLineNumber" th:field="*{newLineNumber}" maxlength="30">
                            <small class="form-error" th:errors="*{newLineNumber}"></small>
                        </div>
                        <div class="form-field">
                            <label for="newLineCarrier">Proveedor</label>
                            <input id="newLineCarrier" th:field="*{newLineCarrier}" maxlength="100">
                            <small class="form-error" th:errors="*{newLineCarrier}"></small>
                        </div>
                    </div>
                </details>
            </div>

            <div class="form-field full-width">
                <label for="observations">Observaciones</label>
                <textarea id="observations" th:field="*{observations}" maxlength="2000"></textarea>
                <small class="form-error" th:errors="*{observations}"></small>
            </div>
        </div>

        <div class="form-actions">
            <a class="secondary-button" th:href="@{/phones/{phoneId}(phoneId=${phoneId})}">Cancelar</a>
            <button class="primary-button" type="submit">Guardar cambios</button>
        </div>
    </form>
</main>
</body>
</html>
