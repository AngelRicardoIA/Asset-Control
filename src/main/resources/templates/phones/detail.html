<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/phone-document-head :: phoneDocumentHead('Detalle del teléfono')}"></head>
<body>
<div class="app-shell">
    <header th:replace="~{fragments/phone-navigation :: phoneNavigation('phones')}"></header>

    <main class="phone-page">
        <section class="phone-page-header">
            <div>
                <p class="phone-eyebrow">Teléfonos</p>
                <h1 th:text="${phone.phoneLine != null ? phone.phoneLine.number : phone.imei}"></h1>
                <p th:text="${phone.brand + ' ' + phone.model}"></p>
            </div>

            <div class="phone-actions">
                <a class="phone-button phone-button--secondary"
                   th:href="@{/phones/{phoneId}/edit(phoneId=${phone.id})}">
                    Editar
                </a>

                <a class="phone-button phone-button--primary"
                   th:if="${phone.status.name() != 'RETIRED'}"
                   th:href="@{/phones/{phoneId}/assignments/new(phoneId=${phone.id})}">
                    Asignar
                </a>
            </div>
        </section>

        <p class="phone-alert phone-alert--success"
           th:if="${successMessage}"
           th:text="${successMessage}">
        </p>

        <p class="phone-alert phone-alert--error"
           th:if="${errorMessage}"
           th:text="${errorMessage}">
        </p>

        <section class="phone-detail-grid">
            <article class="phone-panel">
                <h2>Datos del teléfono</h2>

                <dl>
                    <dt>IMEI</dt>
                    <dd th:text="${phone.imei}"></dd>

                    <dt>Marca</dt>
                    <dd th:text="${phone.brand}"></dd>

                    <dt>Modelo</dt>
                    <dd th:text="${phone.model}"></dd>

                    <dt>Estado</dt>
                    <dd>
                        <span class="phone-status"
                              th:classappend="${' phone-status--' + #strings.toLowerCase(phone.status.name())}"
                              th:text="${phone.status.label}">
                        </span>
                    </dd>

                    <dt>Ubicación</dt>
                    <dd th:text="${phone.site.name}"></dd>

                    <dt>Línea</dt>
                    <dd th:text="${phone.phoneLine != null ? phone.phoneLine.number : 'Sin línea asignada'}"></dd>

                    <dt>Proveedor</dt>
                    <dd th:text="${phone.phoneLine != null && phone.phoneLine.carrier != null ? phone.phoneLine.carrier : 'Sin proveedor registrado'}"></dd>

                    <dt>Observaciones</dt>
                    <dd th:text="${phone.observations != null ? phone.observations : 'Sin observaciones'}"></dd>
                </dl>
            </article>

            <article class="phone-panel">
                <h2>Asignaciones activas</h2>

                <p th:if="${#lists.isEmpty(activeAssignments)}">
                    No hay asignaciones activas.
                </p>

                <div class="phone-assignment" th:each="assignment : ${activeAssignments}">
                    <p>
                        <strong th:text="${assignment.person.username}"></strong>
                        <span th:text="${assignment.person.fullName}"></span>
                    </p>

                    <p th:text="${assignment.type.label}"></p>

                    <p th:if="${assignment.dueAt != null}"
                       th:text="${'Vence: ' + assignment.dueAt}">
                    </p>

                    <form th:action="@{/phone-assignments/{assignmentId}/return(assignmentId=${assignment.id})}"
                          method="post">
                        <button class="phone-button phone-button--secondary" type="submit">
                            Devolver
                        </button>
                    </form>
                </div>
            </article>
        </section>

        <section class="phone-panel">
            <h2>Historial de asignaciones</h2>

            <p th:if="${#lists.isEmpty(assignmentHistory)}">
                Aún no hay movimientos.
            </p>

            <div class="phone-assignment" th:each="assignment : ${assignmentHistory}">
                <p>
                    <strong th:text="${assignment.person.username}"></strong>
                    <span th:text="${assignment.type.label}"></span>
                    <span th:text="${assignment.assignedAt}"></span>
                </p>

                <p th:if="${assignment.returnedAt != null}"
                   th:text="${'Devuelto: ' + assignment.returnedAt}">
                </p>
            </div>
        </section>
    </main>
</div>
</body>
</html>
