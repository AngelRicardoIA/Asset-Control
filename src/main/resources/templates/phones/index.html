<!DOCTYPE html>
<html lang="es" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/document-head :: head('Teléfonos')}"></head>
<body>
<header th:replace="~{fragments/app-header :: header}"></header>

<main class="page-content">
    <section class="page-heading">
        <div>
            <p class="eyebrow">Inventario</p>
            <h1>Teléfonos</h1>
            <p>Equipos móviles y líneas disponibles.</p>
        </div>
        <a class="primary-button" th:href="@{/phones/new}">Nuevo teléfono</a>
    </section>

    <form class="filter-panel" th:action="@{/phones}" method="get">
        <input
                type="search"
                name="query"
                th:value="${query}"
                placeholder="IMEI, marca, modelo, línea o ubicación"
        >

        <select name="status">
            <option value="">Todos los estados</option>
            <option
                    th:each="status : ${phoneStatuses}"
                    th:value="${status}"
                    th:selected="${status == selectedStatus}"
                    th:text="${status.label}"
            ></option>
        </select>

        <button class="secondary-button" type="submit">Filtrar</button>
    </form>

    <p class="alert alert--success" th:if="${successMessage}" th:text="${successMessage}"></p>
    <p class="alert alert--error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <section class="inventory-panel">
        <div class="empty-state" th:if="${#lists.isEmpty(phones)}">
            <h2>No se encontraron teléfonos</h2>
            <p>Registra un teléfono o ajusta los filtros de búsqueda.</p>
        </div>

        <div class="phone-list" th:unless="${#lists.isEmpty(phones)}">
            <a
                    class="phone-item"
                    th:each="phone : ${phones}"
                    th:href="@{/phones/{phoneId}(phoneId=${phone.id})}"
            >
                <div class="phone-main-data">
                    <strong th:text="${phone.phoneLine != null ? phone.phoneLine.number : phone.imei}"></strong>
                    <span th:text="${phone.brand + ' ' + phone.model}"></span>
                    <small th:text="${'IMEI: ' + phone.imei + ' · ' + phone.site.name}"></small>

                    <div
                            class="phone-users"
                            th:if="${primaryAssignmentsByPhoneId != null and primaryAssignmentsByPhoneId.containsKey(phone.id)}"
                    >
                        <span>Usuario:</span>
                        <strong th:text="${primaryAssignmentsByPhoneId.get(phone.id).person.username}"></strong>
                    </div>

                    <div
                            class="phone-last-user"
                            th:if="${phone.status.name() == 'AVAILABLE' and lastClosedAssignmentByPhoneId != null and lastClosedAssignmentByPhoneId.containsKey(phone.id)}"
                    >
                        <span>Último usuario:</span>
                        <strong th:text="${lastClosedAssignmentByPhoneId.get(phone.id).person.username}"></strong>
                    </div>
                </div>

                <span
                        class="status-badge"
                        th:classappend="${' status-' + #strings.toLowerCase(phone.status.name())}"
                        th:text="${phone.status.label}"
                ></span>
            </a>
        </div>
    </section>
</main>
</body>
</html>
