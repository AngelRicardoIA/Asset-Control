<!DOCTYPE html>
<html lang="es" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/document-head :: head('Equipos de cómputo')}"></head>
<body>
<header th:replace="~{fragments/app-header :: header}"></header>

<main class="page-content">
    <section class="page-heading">
        <div>
            <p class="eyebrow">Inventario</p>
            <h1>Equipos de cómputo</h1>
            <p>Consulta, filtra y administra laptops y equipos de escritorio.</p>
        </div>
        <a class="primary-button" th:href="@{/computers/new}">Nuevo equipo</a>
    </section>

    <form class="filter-panel" th:action="@{/computers}" method="get">
        <input
                type="search"
                name="query"
                th:value="${query}"
                placeholder="Hostname, usuario, nombre, asset, marca o modelo"
        >

        <select name="status">
            <option value="">Todos los estados</option>
            <option
                    th:each="status : ${computerStatuses}"
                    th:value="${status}"
                    th:selected="${status == selectedStatus}"
                    th:text="${status == T(com.assetcontrol.computers.domain.ComputerStatus).AVAILABLE ? 'Disponible' : status == T(com.assetcontrol.computers.domain.ComputerStatus).ASSIGNED ? 'Asignado' : status == T(com.assetcontrol.computers.domain.ComputerStatus).LOANED ? 'Préstamo' : 'Baja'}"
            ></option>
        </select>

        <select name="type">
            <option value="">Todos los tipos</option>
            <option
                    th:each="type : ${computerTypes}"
                    th:value="${type}"
                    th:selected="${type == selectedType}"
                    th:text="${type == T(com.assetcontrol.computers.domain.ComputerType).LAPTOP ? 'Laptop' : 'Equipo de escritorio'}"
            ></option>
        </select>

        <button class="secondary-button" type="submit">Filtrar</button>
    </form>

    <section class="inventory-panel">
        <div class="empty-state" th:if="${#lists.isEmpty(computers)}">
            <h2>No se encontraron equipos</h2>
            <p>Registra un equipo o ajusta los filtros de búsqueda.</p>
        </div>

        <div class="computer-list" th:unless="${#lists.isEmpty(computers)}">
            <a
                    class="computer-item"
                    th:each="computer : ${computers}"
                    th:href="@{/computers/{id}(id=${computer.id})}"
            >
                <div class="computer-main-data">
                    <strong th:text="${computer.host}">HOST-001</strong>
                    <span th:text="${computer.brand + ' ' + computer.model}">Marca Modelo</span>
                    <small th:text="${'Asset: ' + computer.asset + ' · ' + computer.site.name}">
                        Asset · Ubicación
                    </small>

                    <div
                            class="computer-users"
                            th:if="${activeAssignmentsByComputerId.containsKey(computer.id)}"
                    >
                        <span>Usuario:</span>
                        <strong
                                th:each="assignment, iteration : ${activeAssignmentsByComputerId.get(computer.id)}"
                                th:text="${assignment.person.username + (iteration.last ? '' : ', ')}"
                        >usuario</strong>
                    </div>
                    <div
                            class="computer-last-user"
                            th:if="${computer.status == T(com.assetcontrol.computers.domain.ComputerStatus).AVAILABLE and lastClosedAssignmentByComputerId.containsKey(computer.id)}"
                    >
                        <span>Último usuario:</span>
                        <strong
                                th:text="${lastClosedAssignmentByComputerId.get(computer.id).person.username}"
                        >usuario</strong>
                    </div>
                </div>

                <span
                        class="status-badge"
                        th:classappend="${' status-' + #strings.toLowerCase(computer.status.name())}"
                        th:text="${computer.status == T(com.assetcontrol.computers.domain.ComputerStatus).AVAILABLE ? 'Disponible' : computer.status == T(com.assetcontrol.computers.domain.ComputerStatus).ASSIGNED ? 'Asignado' : computer.status == T(com.assetcontrol.computers.domain.ComputerStatus).LOANED ? 'Préstamo' : 'Baja'}"
                >Disponible</span>
            </a>
        </div>
    </section>
</main>
</body>
</html>
