<!DOCTYPE html>
<html lang="es" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/document-head :: head('Editar equipo')}"></head>
<body>
<header th:replace="~{fragments/app-header :: header}"></header>

<main class="page-content">
    <section class="page-heading">
        <div>
            <p class="eyebrow">Inventario</p>
            <h1 th:text="${computer.host}">HOST-001</h1>
            <p>Editar datos físicos y administrativos del equipo.</p>
        </div>
    </section>

    <form
            class="form-panel"
            th:action="@{/computers/{id}(id=${computer.id})}"
            th:object="${editForm}"
            method="post"
    >
        <div class="field-grid">
            <div class="form-field">
                <label for="asset">Asset</label>
                <input id="asset" type="text" th:field="*{asset}" maxlength="100">
                <small class="form-error" th:errors="*{asset}"></small>
            </div>

            <div class="form-field">
                <label for="host">Hostname</label>
                <input id="host" type="text" th:field="*{host}" maxlength="100">
                <small class="form-error" th:errors="*{host}"></small>
            </div>

            <div class="form-field">
                <label for="type">Tipo</label>
                <select id="type" th:field="*{type}">
                    <option value="">Selecciona una opción</option>
                    <option
                            th:each="type : ${computerTypes}"
                            th:value="${type}"
                            th:text="${type == T(com.assetcontrol.computers.domain.ComputerType).LAPTOP ? 'Laptop' : 'Equipo de escritorio'}"
                    ></option>
                </select>
                <small class="form-error" th:errors="*{type}"></small>
            </div>

            <div class="form-field">
                <label for="brand">Marca</label>
                <input id="brand" type="text" th:field="*{brand}" maxlength="100">
                <small class="form-error" th:errors="*{brand}"></small>
            </div>

            <div class="form-field">
                <label for="model">Modelo</label>
                <input id="model" type="text" th:field="*{model}" maxlength="150">
                <small class="form-error" th:errors="*{model}"></small>
            </div>

            <div class="form-field">
                <label for="serialNumber">Número de serie</label>
                <input id="serialNumber" type="text" th:field="*{serialNumber}" maxlength="150">
                <small class="form-error" th:errors="*{serialNumber}"></small>
            </div>

            <div class="form-field">
                <label for="chargerSerialNumber">Serie del cargador</label>
                <input
                        id="chargerSerialNumber"
                        type="text"
                        th:field="*{chargerSerialNumber}"
                        maxlength="150"
                >
                <small class="form-error" th:errors="*{chargerSerialNumber}"></small>
            </div>

            <div class="form-field">
                <label for="operatingSystem">Sistema operativo</label>
                <input id="operatingSystem" type="text" th:field="*{operatingSystem}" maxlength="100">
                <small class="form-error" th:errors="*{operatingSystem}"></small>
            </div>

            <div class="form-field">
                <label for="status">Estado</label>
                <select id="status" th:field="*{status}">
                    <option
                            th:each="status : ${computerStatuses}"
                            th:value="${status}"
                            th:text="${status == T(com.assetcontrol.computers.domain.ComputerStatus).AVAILABLE ? 'Disponible' : status == T(com.assetcontrol.computers.domain.ComputerStatus).ASSIGNED ? 'Asignado' : status == T(com.assetcontrol.computers.domain.ComputerStatus).LOANED ? 'Préstamo' : 'Baja'}"
                    ></option>
                </select>
                <small class="form-error" th:errors="*{status}"></small>
            </div>

            <div class="form-field full-width">
                <p class="field-help">
                    Asignado y Préstamo se actualizan mediante movimientos. Baja bloquea nuevas asignaciones.
                </p>
            </div>

            <div class="form-field full-width">
                <label for="siteId">Ubicación actual</label>
                <select id="siteId" th:field="*{siteId}">
                    <option value="">Selecciona una ubicación</option>
                    <option
                            th:each="site : ${sites}"
                            th:value="${site.id}"
                            th:text="${site.name}"
                    ></option>
                </select>

                <details class="inline-site-creation">
                    <summary>Agregar una ubicación nueva</summary>

                    <div class="form-field">
                        <label for="newSiteName">Nombre de la ubicación</label>
                        <input id="newSiteName" type="text" th:field="*{newSiteName}" maxlength="100">
                        <small class="form-error" th:errors="*{newSiteName}"></small>
                    </div>
                </details>

                <small class="form-error" th:errors="*{siteProvided}"></small>
            </div>

            <div class="form-field full-width">
                <label for="observations">Observaciones</label>
                <textarea id="observations" th:field="*{observations}" maxlength="1000"></textarea>
                <small class="form-error" th:errors="*{observations}"></small>
            </div>
        </div>

        <div class="form-actions">
            <a class="secondary-button" th:href="@{/computers/{id}(id=${computer.id})}">Cancelar</a>
            <button class="primary-button" type="submit">Guardar cambios</button>
        </div>
    </form>
</main>
</body>
</html>
