<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/document-head :: head('Responsiva de asignación')}"></head>
<body>
<header th:replace="~{fragments/app-header :: header}"></header>

<main class="page-content narrow-content">
    <section class="page-heading">
        <div>
            <p class="eyebrow">Responsiva de asignación</p>
            <h1>No se pudo descargar el documento</h1>
        </div>
    </section>

    <section class="form-panel">
        <p role="alert" th:text="${message}">Revisa los datos de la asignación y su plantilla.</p>
        <p>Puedes volver al equipo e intentar la descarga cuando se haya corregido el problema.</p>
        <div class="form-actions">
            <a class="primary-button" th:href="@{/computers}">Volver al inventario</a>
        </div>
    </section>
</main>
</body>
</html>
