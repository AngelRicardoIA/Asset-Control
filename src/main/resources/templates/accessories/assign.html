<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/document-head :: head('Asignar accesorio')}"></head>
<body><header th:replace="~{fragments/app-header :: header}"></header><main class="page-content narrow-content">
<section class="page-heading"><div><p class="eyebrow">Accesorios</p><h1>Asignar accesorio</h1><p th:text="${accessory.type.label + ' · ' + accessory.brand + ' ' + accessory.model}">Accesorio</p></div></section>
<form class="form-panel" th:action="@{/accessories/{id}/assign(id=${accessory.id})}" th:object="${form}" method="post"><p class="alert alert--error" th:each="error : ${#fields.globalErrors()}" th:text="${error}">Error</p>
<div class="field-grid"><div class="form-field full-width"><label for="personId">Persona</label><select id="personId" th:field="*{personId}"><option value="">Selecciona una persona</option><option th:each="person : ${people}" th:value="${person.id}" th:text="${person.username + ' · ' + person.fullName + ' · ID ' + person.externalId}"></option></select><small class="form-error" th:errors="*{personId}"></small><small class="field-help"><a th:href="@{/people/new}">Crear persona</a> si aún no está registrada.</small></div>
<div class="form-field"><label for="assignedAt">Fecha de asignación</label><input id="assignedAt" type="date" th:field="*{assignedAt}"><small class="form-error" th:errors="*{assignedAt}"></small></div><div class="form-field"><label for="assignedBy">Entregado por</label><input id="assignedBy" th:field="*{assignedBy}" maxlength="100"><small class="form-error" th:errors="*{assignedBy}"></small></div></div>
<p class="field-help" th:if="${accessory.type == T(com.assetcontrol.accessories.domain.AccessoryType).MONITOR}">Después de guardar aparecerá la responsiva del monitor para descargar.</p><div class="form-actions"><a class="secondary-button" th:href="@{/accessories/{id}(id=${accessory.id})}">Cancelar</a><button class="primary-button" type="submit">Confirmar asignación</button></div></form></main></body></html>
