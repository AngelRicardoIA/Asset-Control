<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/document-head :: head('Accesorio')}"></head>
<body><header th:replace="~{fragments/app-header :: header}"></header><main class="page-content narrow-content">
<section class="page-heading"><div><p class="eyebrow">Accesorios</p><h1 th:text="${editing ? 'Editar accesorio' : 'Nuevo accesorio'}">Nuevo accesorio</h1><p>Cada registro representa una unidad que puede asignarse a una persona.</p></div></section>
<form class="form-panel" th:action="${editing} ? @{/accessories/{id}/edit(id=${accessoryId})} : @{/accessories}" th:object="${form}" method="post">
    <p class="alert alert--error" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}">Error</p>
    <div class="field-grid">
        <div class="form-field"><label for="type">Tipo</label><select id="type" th:field="*{type}"><option value="">Selecciona</option><option th:each="option : ${types}" th:value="${option}" th:text="${option.label}"></option></select><small class="form-error" th:errors="*{type}"></small></div>
        <div class="form-field"><label for="brand">Marca</label><input id="brand" th:field="*{brand}" maxlength="100"><small class="form-error" th:errors="*{brand}"></small></div>
        <div class="form-field"><label for="model">Modelo</label><input id="model" th:field="*{model}" maxlength="150"><small class="form-error" th:errors="*{model}"></small></div>
        <div class="form-field"><label for="serialNumber">Número de serie, si existe</label><input id="serialNumber" th:field="*{serialNumber}" maxlength="150"><small class="form-error" th:errors="*{serialNumber}"></small></div>
        <div class="form-field"><label for="asset">Asset, si aplica</label><input id="asset" th:field="*{asset}" maxlength="100"><small class="form-error" th:errors="*{asset}"></small></div>
        <div class="form-field" th:unless="${editing}"><label for="quantity">Unidades a registrar</label><input id="quantity" type="number" min="1" max="200" th:field="*{quantity}"><small class="field-help">Para varias unidades, deja en blanco serie y asset. Después podrás editar cada ficha.</small><small class="form-error" th:errors="*{quantity}"></small></div>
    </div><div class="form-actions"><a class="secondary-button" th:href="${editing} ? @{/accessories/{id}(id=${accessoryId})} : @{/accessories}">Cancelar</a><button class="primary-button" type="submit">Guardar accesorio</button></div>
</form></main></body></html>
