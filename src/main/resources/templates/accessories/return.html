<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/document-head :: head('Devolver accesorio')}"></head>
<body><header th:replace="~{fragments/app-header :: header}"></header><main class="page-content narrow-content"><section class="page-heading"><div><p class="eyebrow">Accesorios</p><h1>Confirmar devolución</h1><p th:text="${accessory.type.label + ' · ' + accessory.brand + ' ' + accessory.model}">Accesorio</p></div></section>
<section class="form-panel"><p th:text="${'Asignado a: ' + assignment.person.fullName + ' · ' + assignment.person.username}">Persona</p><p th:text="${'Desde: ' + #temporals.format(assignment.assignedAt, 'dd/MM/yyyy')}">Fecha</p></section>
<form class="form-panel" th:action="@{/accessories/{id}/return(id=${accessory.id})}" th:object="${form}" method="post"><div class="field-grid">
<div class="form-field"><label for="returnedAt">Fecha de devolución</label><input id="returnedAt" type="date" th:field="*{returnedAt}"><small class="form-error" th:errors="*{returnedAt}"></small></div><div class="form-field"><label for="receivedBy">Recibido por</label><input id="receivedBy" th:field="*{receivedBy}" maxlength="100"><small class="form-error" th:errors="*{receivedBy}"></small></div><div class="form-field full-width"><label for="notes">Comentarios</label><textarea id="notes" th:field="*{notes}" maxlength="1000"></textarea><small class="form-error" th:errors="*{notes}"></small></div>
</div><div class="form-actions"><a class="secondary-button" th:href="@{/accessories/{id}(id=${accessory.id})}">Cancelar</a><button class="primary-button" type="submit">Confirmar devolución</button></div></form></main></body></html>
