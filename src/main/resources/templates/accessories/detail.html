<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/document-head :: head('Detalle del accesorio')}"></head>
<body>
<header th:replace="~{fragments/app-header :: header}"></header>
<main class="page-content">
    <section class="page-heading">
        <div>
            <p class="eyebrow" th:text="${accessory.type.label}">Accesorio</p>
            <h1 th:text="${accessory.brand + ' ' + accessory.model}">Marca Modelo</h1>
            <p th:text="${'Registro #' + accessory.id}">Registro</p>
        </div>
        <nav class="action-toolbar" aria-label="Acciones del accesorio">
            <a class="icon-action" th:href="@{/accessories}" aria-label="Volver a accesorios" data-tooltip="Volver a accesorios">
                <svg th:replace="~{fragments/icons :: arrowLeft}"></svg>
            </a>
            <a class="icon-action" th:href="@{/accessories/{id}/edit(id=${accessory.id})}"
               aria-label="Editar accesorio" data-tooltip="Editar accesorio">
                <svg th:replace="~{fragments/icons :: pencil}"></svg>
            </a>
            <a class="icon-action icon-action--primary" th:if="${activeAssignment == null}"
               th:href="@{/accessories/{id}/assign(id=${accessory.id})}"
               aria-label="Asignar a persona" data-tooltip="Asignar a persona">
                <svg th:replace="~{fragments/icons :: userPlus}"></svg>
            </a>
            <a class="icon-action icon-action--primary" th:if="${activeAssignment != null}"
               th:href="@{/accessories/{id}/return(id=${accessory.id})}"
               aria-label="Devolver al stock" data-tooltip="Devolver al stock">
                <svg th:replace="~{fragments/icons :: returnAsset}"></svg>
            </a>
        </nav>
    </section>

    <p class="alert alert--success" th:if="${successMessage}" th:text="${successMessage}"></p>

    <section class="detail-grid">
        <article class="detail-card"><span>Estado</span><strong th:text="${activeAssignment == null ? 'Stock' : 'Asignado'}">Stock</strong></article>
        <article class="detail-card"><span>Tipo</span><strong th:text="${accessory.type.label}">Monitor</strong></article>
        <article class="detail-card"><span>Marca y modelo</span><strong th:text="${accessory.brand + ' ' + accessory.model}">Marca Modelo</strong></article>
        <article class="detail-card"><span>Número de serie</span><strong th:text="${accessory.serialNumber ?: 'Sin registrar'}">Serie</strong></article>
        <article class="detail-card"><span>Asset</span><strong th:text="${accessory.asset ?: 'No aplica'}">Asset</strong></article>
    </section>

    <section class="form-panel" th:if="${activeAssignment != null}">
        <div class="section-heading maintenance-panel__heading">
            <div>
                <h2>Asignación actual</h2>
                <p th:text="${activeAssignment.person.fullName + ' · ' + activeAssignment.person.username}">Persona</p>
            </div>
            <nav class="action-toolbar" aria-label="Acciones de la asignación">
                <a class="icon-action" th:href="@{/people/{id}(id=${activeAssignment.person.id})}"
                   aria-label="Ver persona" data-tooltip="Ver persona">
                    <svg th:replace="~{fragments/icons :: users}"></svg>
                </a>
                <a class="icon-action icon-action--info"
                   th:if="${accessory.type == T(com.assetcontrol.accessories.domain.AccessoryType).MONITOR}"
                   th:href="@{/accessories/{id}/assignments/{assignmentId}/responsiva.docx(id=${accessory.id},assignmentId=${activeAssignment.id})}"
                   aria-label="Descargar responsiva" data-tooltip="Responsiva">
                    <svg th:replace="~{fragments/icons :: fileText}"></svg>
                </a>
            </nav>
        </div>
        <p class="field-help" th:text="${'Desde: ' + #temporals.format(activeAssignment.assignedAt, 'dd/MM/yyyy') + ' · Entregado por: ' + activeAssignment.assignedBy}">Fecha</p>
    </section>

    <section class="form-panel assignment-history" id="historial">
        <div class="section-heading">
            <div><h2>Historial de asignaciones</h2><p>Entregas y devoluciones de esta unidad.</p></div>
        </div>
        <p class="empty-state" th:if="${#lists.isEmpty(history)}">Sin asignaciones previas.</p>
        <div class="assignment-list" data-history-list data-history-label="Asignaciones del accesorio"
             th:unless="${#lists.isEmpty(history)}">
            <article class="assignment-item" data-history-item th:each="record : ${history}">
                <div class="assignment-person">
                    <a class="assignment-asset-link" th:href="@{/people/{id}(id=${record.person.id})}"
                       th:text="${record.person.fullName}">Persona</a>
                    <small th:text="${'Usuario: ' + record.person.username + ' · Entregado por: ' + record.assignedBy}">Usuario</small>
                    <small th:text="${'Asignado: ' + #temporals.format(record.assignedAt, 'dd/MM/yyyy')}">Fecha</small>
                    <small th:if="${record.returnedAt != null}"
                           th:text="${'Devuelto: ' + #temporals.format(record.returnedAt, 'dd/MM/yyyy') + ' · Recibido por: ' + record.receivedBy}">Devolución</small>
                    <small th:if="${record.returnNotes != null}" th:text="${'Comentarios: ' + record.returnNotes}">Notas</small>
                </div>
                <span class="status-badge" th:classappend="${record.active ? ' status-assigned' : ' status-returned'}"
                      th:text="${record.active ? 'Asignado' : 'Devuelto'}">Estado</span>
            </article>
        </div>
    </section>
</main>
</body>
</html>
