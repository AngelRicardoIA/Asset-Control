<header class="app-header" th:fragment="header" xmlns:th="http://www.thymeleaf.org">
    <button class="menu-trigger" type="button" data-menu-open aria-label="Abrir menú" aria-controls="main-navigation" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <span class="app-header__title">Asset-Control</span>

    <div class="sidebar-backdrop" data-menu-backdrop hidden></div>
    <aside class="sidebar" id="main-navigation" aria-label="Menú principal" aria-hidden="true" inert data-menu-panel>
        <div class="sidebar__heading">
            <strong>Asset-Control</strong>
            <button class="sidebar__close" type="button" data-menu-close aria-label="Cerrar menú">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19"/></svg>
            </button>
        </div>

        <div class="sidebar__profile">
            <span class="sidebar__avatar" role="img" aria-label="Perfil de usuario">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 20c0-3.7 2.9-6 6.5-6s6.5 2.3 6.5 6"/></svg>
            </span>
            <strong th:text="${navigationSession.displayName()}">Admin</strong>
            <span class="sidebar__profile-note" th:text="${navigationSession.authenticated() ? 'Sesión activa' : 'Sesión local'}">Sesión local</span>
        </div>

        <nav class="sidebar__links" aria-label="Secciones">
            <a class="sidebar__item" th:href="@{/}" data-menu-link>
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                <span>Dashboard</span>
            </a>
            <a class="sidebar__item" th:href="@{/computers}" data-menu-link>
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M2 20h20"/></svg>
                <span>Computadoras</span>
            </a>
            <a class="sidebar__item" th:href="@{/phones}" data-menu-link>
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M10 18h4"/></svg>
                <span>Teléfonos</span>
            </a>
            <button class="sidebar__item sidebar__item--pending" type="button" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7 12 3l9 4v10l-9 4-9-4V7ZM3 7l9 4 9-4M12 11v10"/></svg>
                <span>Accesorios</span>
                <small>Próximamente</small>
            </button>
            <button class="sidebar__item" type="button" data-theme-toggle aria-label="Cambiar a modo oscuro" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.7 15.3A9 9 0 0 1 8.7 3.3 9 9 0 1 0 20.7 15.3Z"/></svg>
                <span data-theme-label>Modo oscuro</span>
            </button>
            <a class="sidebar__item" th:href="@{/maintenance}" data-menu-link>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.8 6.5a3 3 0 0 0 2.7 3.8L10 17.8 6.2 14l7.5-7.5a3 3 0 0 0 3.8 2.7L20 6.7l-2.7-2.7-2.5 2.5Z"/></svg>
                <span>Mantenimientos</span>
            </a>
            <button class="sidebar__item sidebar__item--pending" type="button" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
                <span>Accesos</span>
                <small>Próximamente</small>
            </button>
        </nav>

        <div class="sidebar__footer">
            <form th:if="${navigationSession.authenticated()}" th:action="@{/logout}" method="post">
                <button class="sidebar__item" type="submit">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5M14 8l4 4-4 4M8 12h10"/></svg>
                    <span>Desloguear</span>
                </button>
            </form>
            <button class="sidebar__item sidebar__item--pending" th:unless="${navigationSession.authenticated()}" type="button" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5M14 8l4 4-4 4M8 12h10"/></svg>
                <span>Desloguear</span>
                <small>Sin sesión</small>
            </button>
        </div>
    </aside>
</header>
